<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White circle background -->
  <circle cx="32" cy="32" r="32" fill="white"/>

  <!-- Navy oil-drop / teardrop shape (points upward) -->
  <path d="M32 6
    C32 6 14 22 14 38
    a18 18 0 0 0 36 0
    C50 22 32 6 32 6 Z"
    fill="#1B2E8A"
  />

  <!-- Sailboat lines inside drop (white) -->
  <!-- Center mast -->
  <line x1="32" y1="10" x2="32" y2="44" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left sail edge -->
  <line x1="32" y1="10" x2="18" y2="36" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right sail edge -->
  <line x1="32" y1="10" x2="46" y2="36" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Horizontal boom -->
  <line x1="18" y1="36" x2="46" y2="36" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Red LUBCON band -->
  <rect x="15" y="33" width="34" height="10" rx="1.5" fill="#C0392B"/>
  <text
    x="32" y="41"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="7.5"
    fill="white"
    letter-spacing="0.5"
  >LUBCON</text>

  <!-- Africa text below drop -->
  <text
    x="32" y="58"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="7"
    fill="#1B2E8A"
  >Africa</text>
</svg>
